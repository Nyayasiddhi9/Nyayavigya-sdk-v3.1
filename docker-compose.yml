version: '3.8'

services:
  nyayavighya:
    build: .
    container_name: nyayavighya-sdk-v3.1
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - nyayavighya-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: nyayavighya-postgres
    environment:
      POSTGRES_USER: nyayavighya
      POSTGRES_PASSWORD: ${PGPASSWORD:-secure_password}
      POSTGRES_DB: nyayavighya
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - nyayavighya-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyayavighya -d nyayavighya"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nyayavighya-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - nyayavighya-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  nyayavighya-network:
    driver: bridge
